<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | First Academy Foundation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-shell">

  <div class="admin-topbar">
    <div class="logo-row">
      <img src="images/logo.png" alt="First Academy Foundation logo">
      <strong>Admin Dashboard</strong>
    </div>
    <button class="admin-logout" id="logout-btn">Log Out</button>
  </div>

  <main class="admin-main">

    <section class="admin-panel">
      <h2 id="form-heading">Add a News Post</h2>
      <form id="post-form">
        <div class="admin-form-row">
          <label for="title">Title</label>
          <input type="text" id="title" required>
        </div>
        <div class="admin-grid-2">
          <div class="admin-form-row">
            <label for="event_date">Date</label>
            <input type="date" id="event_date">
          </div>
          <div class="admin-form-row">
            <label for="image">Photo (optional)</label>
            <input type="file" id="image" accept="image/*">
          </div>
        </div>
        <div class="admin-form-row">
          <label for="description">Description</label>
          <textarea id="description" rows="4" required></textarea>
        </div>
        <div class="admin-checkbox-row">
          <input type="checkbox" id="is_published" checked>
          <label for="is_published">Visible on the public website</label>
        </div>
        <div class="admin-form-actions">
          <button type="submit" class="btn" id="save-btn">Save Post</button>
          <button type="button" class="admin-btn-cancel" id="cancel-edit" style="display:none;">Cancel Edit</button>
        </div>
        <p class="admin-status" id="form-status"></p>
      </form>
    </section>

    <section class="admin-panel">
      <h2>Manage Posts</h2>
      <div class="admin-post-list" id="post-list">
        <p class="admin-note">Loading posts&hellip;</p>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
