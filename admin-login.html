<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | First Academy Foundation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-card">
    <div class="logo-row">
      <img src="images/logo.png" alt="First Academy Foundation logo">
      <span>First Academy Foundation</span>
    </div>
    <h1>Admin Login</h1>
    <p class="admin-sub">Sign in to manage news &amp; photos.</p>

    <p class="admin-error" id="login-error"></p>

    <form id="login-form">
      <div class="admin-form-row">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="admin-form-row">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" style="width:100%;" id="login-btn">Sign In</button>
    </form>

    <p style="text-align:center;margin-top:16px;">
      <button type="button" id="show-forgot" style="background:none;border:none;color:var(--green);font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:underline;">Forgot password?</button>
    </p>

    <div id="forgot-panel" style="display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);">
      <p class="admin-sub" style="margin-bottom:14px;">Enter your email and we'll send you a reset link.</p>
      <p class="admin-error" id="forgot-error"></p>
      <p class="admin-status success" id="forgot-success" style="text-align:center;margin-bottom:10px;"></p>
      <form id="forgot-form">
        <div class="admin-form-row">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" required>
        </div>
        <button type="submit" class="btn" style="width:100%;" id="forgot-btn">Send Reset Link</button>
      </form>
    </div>

    <p class="admin-note">This page is for school administrators only.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-auth.js"></script>
</body>
</html>
