<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | First Academy Foundation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-card">
    <div class="logo-row">
      <img src="images/logo.png" alt="First Academy Foundation logo">
      <span>First Academy Foundation</span>
    </div>
    <h1>Set a New Password</h1>
    <p class="admin-sub" id="reset-sub">Enter a new password for your admin account.</p>

    <p class="admin-error" id="reset-error"></p>

    <form id="reset-form">
      <div class="admin-form-row">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="admin-form-row">
        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn" style="width:100%;" id="reset-btn">Update Password</button>
    </form>

    <p class="admin-note"><a href="admin-login.html">Back to login</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-reset.js"></script>
</body>
</html>
